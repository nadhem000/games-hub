<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GameHub - Bottle Duel</title>
    <link rel="stylesheet" href="main.css">
    <style>
        /* ... (all existing CSS unchanged) ... */
        :root {
            --game-primary: #3A86FF;
            --game-secondary: #2667CC;
            --game-accent: #FF006E;
            --game-wall-light: #c9a87c;
            --game-wall-dark: #3a2a1a;
            --game-shelf: #8B5E3C;
            --game-shelf-dark: #5C3A21;
            --game-bottle: #2d8a4e;
        }

        .GH-game-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: var(--gh-space-lg);
        }

        .GH-game-header-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--game-card-bg);
            padding: var(--gh-space-md) var(--gh-space-lg);
            border-radius: var(--gh-radius-lg);
            margin-bottom: var(--gh-space-lg);
            box-shadow: var(--gh-shadow-md);
            flex-wrap: wrap;
            gap: var(--gh-space-md);
            border: 1px solid rgba(58,134,255,0.1);
        }
        .GH-dark-mode .GH-game-header-stats {
            background: var(--game-dark-card-bg);
            border-color: rgba(58,134,255,0.2);
        }

        .GH-game-stats {
            display: flex;
            gap: var(--gh-space-md);
            flex-wrap: wrap;
        }
        .GH-stat-box {
            background: rgba(58,134,255,0.08);
            padding: var(--gh-space-sm) var(--gh-space-md);
            border-radius: var(--gh-radius-md);
            text-align: center;
            min-width: 80px;
            border: 1px solid rgba(58,134,255,0.12);
            transition: 0.2s;
        }
        .GH-stat-box:hover { transform: translateY(-2px); }
        .GH-stat-value {
            font-size: var(--gh-font-size-xl);
            font-weight: bold;
            color: var(--game-primary);
        }
        .GH-dark-mode .GH-stat-value { color: #8bb9ff; }
        .GH-stat-label {
            font-size: var(--gh-font-size-sm);
            opacity: 0.85;
            font-weight: 600;
        }

        .GH-wind-box {
            display: flex;
            align-items: center;
            gap: var(--gh-space-sm);
            background: rgba(58,134,255,0.08);
            padding: var(--gh-space-sm) var(--gh-space-md);
            border-radius: 50px;
            border: 1px solid rgba(58,134,255,0.15);
            font-weight: 600;
        }
        .GH-wind-arrow {
            font-size: 1.5rem;
            display: inline-block;
            transition: transform 0.3s;
        }

        .GH-game-area {
            background: var(--game-card-bg);
            border-radius: var(--gh-radius-lg);
            box-shadow: var(--gh-shadow-md);
            margin: var(--gh-space-md) 0;
            position: relative;
            border: 1px solid rgba(58,134,255,0.1);
            overflow: hidden;
            touch-action: none;
            user-select: none;
            cursor: none;
        }
        .GH-dark-mode .GH-game-area {
            background: var(--game-dark-card-bg);
            border-color: rgba(58,134,255,0.2);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: none;
        }

        .GH-crosshair {
            position: absolute;
            pointer-events: none;
            z-index: 30;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            display: none;
        }
        .GH-crosshair::before,
        .GH-crosshair::after {
            content: '';
            position: absolute;
            background: #FF006E;
            box-shadow: 0 0 8px rgba(255,0,110,0.8);
        }
        .GH-crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        .GH-crosshair::after {
            height: 2px;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
        }

        .GH-turn-indicator {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 6px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            z-index: 25;
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .GH-game-controls {
            display: flex;
            justify-content: center;
            gap: var(--gh-space-md);
            margin-top: var(--gh-space-lg);
            flex-wrap: wrap;
        }
        .GH-game-btn {
            background: linear-gradient(135deg, var(--game-primary), var(--game-secondary));
            border: none;
            color: white;
            padding: 12px 28px;
            font-size: var(--gh-font-size-base);
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: var(--gh-shadow-md);
            min-width: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .GH-game-btn.secondary {
            background: transparent;
            border: 2px solid var(--game-primary);
            color: var(--game-primary);
            box-shadow: none;
        }
        .GH-dark-mode .GH-game-btn.secondary {
            border-color: var(--game-accent);
            color: var(--game-accent);
        }

        .GH-game-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10,25,47,0.9);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .GH-game-modal.active {
            opacity: 1;
            visibility: visible;
        }
        .GH-modal-content {
            background: var(--game-card-bg);
            padding: var(--gh-space-xl);
            border-radius: var(--gh-radius-lg);
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: var(--gh-shadow-lg);
            transform: scale(0.9);
            transition: transform 0.3s;
            border: 1px solid rgba(58,134,255,0.2);
        }
        .GH-game-modal.active .GH-modal-content { transform: scale(1); }
        .GH-dark-mode .GH-modal-content {
            background: var(--game-dark-card-bg);
            border-color: rgba(58,134,255,0.3);
        }
        .GH-modal-title {
            font-size: var(--gh-font-size-2xl);
            margin-bottom: var(--gh-space-md);
            color: var(--game-primary);
        }
        .GH-modal-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--gh-space-md);
            margin: var(--gh-space-lg) 0;
        }
        .GH-modal-stat {
            padding: var(--gh-space-md);
            border-radius: var(--gh-radius-md);
            background: rgba(58,134,255,0.08);
            border: 1px solid rgba(58,134,255,0.15);
        }
        .GH-modal-stat-value {
            font-size: var(--gh-font-size-xl);
            font-weight: bold;
            color: var(--game-primary);
        }
        .GH-modal-stat-label { font-size: var(--gh-font-size-sm); opacity: 0.8; }

        .GH-mode-selector,
        .GH-difficulty-selector {
            display: flex;
            justify-content: center;
            gap: var(--gh-space-sm);
            margin: var(--gh-space-md) 0;
            flex-wrap: wrap;
        }
        .GH-mode-btn,
        .GH-diff-btn {
            padding: 10px 18px;
            border: 2px solid var(--game-primary);
            background: transparent;
            color: var(--game-primary);
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .GH-mode-btn.active,
        .GH-diff-btn.active {
            background: var(--game-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(58,134,255,0.3);
        }
        .GH-dark-mode .GH-mode-btn,
        .GH-dark-mode .GH-diff-btn {
            border-color: var(--game-accent);
            color: var(--game-accent);
        }
        .GH-dark-mode .GH-mode-btn.active,
        .GH-dark-mode .GH-diff-btn.active {
            background: var(--game-accent);
            color: var(--game-dark-bg);
        }

        @media (max-width: 768px) {
            .GH-game-header-stats { flex-direction: column; }
            .GH-stat-box { min-width: 70px; }
            .GH-stat-value { font-size: 18px; }
            .GH-game-btn { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body class="GH-body GH-light-mode">

        <div class="GH-header-content">
            <div class="GH-logo-section">
                <a href="index.html" class="GH-logo-link" data-i18n-title="GH.general.homeTooltip">

    <script src="translation.js"></script>
    <script src="global.js"></script>
    <script>
        (function() {
            // ---------- TRANSLATION SYSTEM ----------
            function t(key, fallback) {
                const translations = window.getTranslations ? window.getTranslations() : {};
                const cleanKey = key.startsWith('GH.') ? key.slice(3) : key;
                const parts = cleanKey.split('.');
                let val = translations;
                for (let p of parts) {
                    if (val && typeof val === 'object') val = val[p];
                    else { val = undefined; break; }
                }
                return (typeof val === 'string') ? val : (fallback || key);
            }

            function updateAllTexts() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (key && el.children.length === 0) {
                        el.textContent = t(key, el.textContent);
                    }
                });
                document.querySelectorAll('[data-i18n-title]').forEach(el => {
                    const key = el.getAttribute('data-i18n-title');
                    if (key) el.setAttribute('title', t(key, ''));
                });
                document.querySelectorAll('[data-i18n-alt]').forEach(el => {
                    const key = el.getAttribute('data-i18n-alt');
                    if (key) el.setAttribute('alt', t(key, ''));
                });
                // Update dynamic texts
                if (gameActive) updateHUDTexts();
            }

            function updateHUDTexts() {
                document.getElementById('turnIndicator').textContent = getTurnText();
                document.getElementById('shotsLeft').textContent = players[currentPlayer].shotsLeft;
                document.getElementById('p1Hits').textContent = players[0].hits;
                document.getElementById('p2Hits').textContent = players[1].hits;
            }

            // ---------- NOTIFICATIONS ----------
            const notifEl = document.getElementById('game-notification');
            function notify(msg, type) {
                if (!notifEl || (document.getElementById('notificationToggle')?.classList.contains('GH-notifications-off'))) return;
                notifEl.textContent = msg;
                notifEl.className = 'GH-game-notification ' + type;
                notifEl.style.display = 'block';
                notifEl.classList.add('show');
                setTimeout(() => {
                    notifEl.classList.remove('show');
                    setTimeout(() => { notifEl.style.display = 'none'; }, 300);
                }, 2400);
            }

            // ---------- GAME STATE ----------
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const logicalW = 900, logicalH = 500;

            let gameActive = false;
            let currentMode = 'warmup';
            let currentDifficulty = 'easy';
            const MAX_SHOTS = 5;
            let players = [
                { name: 'Player 1', hits: 0, shotsLeft: MAX_SHOTS },
                { name: 'Player 2', hits: 0, shotsLeft: MAX_SHOTS }
            ];
            let currentPlayer = 0;
            let bottle = { x: logicalW/2, y: 200, w: 50, h: 90, vx: 0, alive: true, image: null };
            let wind = { speed: 0, angle: 0, dx: 0, dy: 0 };
            let mouseX = logicalW/2, mouseY = logicalH/2;
            let lastShotTime = 0;
            let particles = [], floatingTexts = [];
            // NEW: Array to store bullet hole marks
            let shotMarks = [];
            let aiTimeout = null, animationId = null;
            const BOTTLE_MIN_X = 140, BOTTLE_MAX_X = logicalW - 140;

            // Gun image replacement
            const gunImage = new Image();
            gunImage.src = 'assets2/images/divers/gun.png';

            // --- Preload bottle images ---
            const bottleImages = [];
            for (let i = 1; i <= 4; i++) {
                const img = new Image();
                img.src = 'assets2/images/divers/bottle' + i + '.png';
                bottleImages.push(img);
            }

            function resetBottle() {
                bottle.x = BOTTLE_MIN_X + Math.random() * (BOTTLE_MAX_X - BOTTLE_MIN_X);
                bottle.vx = (Math.random() - 0.5) * 60;
                bottle.alive = true;
                // Randomly select one of the four bottle images
                bottle.image = bottleImages[Math.floor(Math.random() * bottleImages.length)];
            }

            function generateWind() {
                const speeds = currentDifficulty === 'easy' ? [0,1] : currentDifficulty === 'medium' ? [0,1,2] : [0,1,2,3];
                wind.speed = speeds[Math.floor(Math.random() * speeds.length)];
                wind.angle = Math.random() < 0.6 ? (Math.random() < 0.5 ? 0 : Math.PI) : (Math.PI/2 * (Math.random()<0.5?1:-1));
                wind.dx = Math.cos(wind.angle) * wind.speed;
                wind.dy = Math.sin(wind.angle) * wind.speed;
                document.getElementById('windSpeedText').textContent = wind.speed;
                const arrow = document.getElementById('windArrow');
                arrow.style.transform = `rotate(${wind.angle * 180/Math.PI + 90}deg)`;
                arrow.textContent = wind.dx > 0.5 ? '→' : wind.dx < -0.5 ? '←' : '•';
            }

            function getTurnText() {
                if (!gameActive) return '';
                if (currentMode === 'warmup') return t('GH.bottleDuel.shootBottle', 'Shoot the bottle!');
                return players[currentPlayer].name + ' - ' + players[currentPlayer].shotsLeft + ' ' + t('GH.bottleDuel.shotsRemaining', 'shots left');
            }

            function updateHUD() {
                document.getElementById('p1Hits').textContent = players[0].hits;
                document.getElementById('shotsLeft').textContent = players[currentPlayer].shotsLeft;
                document.getElementById('p2Hits').textContent = players[1].hits;
                document.getElementById('p2Stats').style.display = (currentMode === 'pvp' || currentMode === 'ai') ? 'flex' : 'none';
                document.getElementById('turnIndicator').textContent = getTurnText();
            }

            function switchTurn() {
                if (currentMode === 'warmup') return;
                currentPlayer = currentPlayer === 0 ? 1 : 0;
                players[currentPlayer].shotsLeft = MAX_SHOTS;
                resetBottle();
                generateWind();
                updateHUD();
                if (currentMode === 'ai' && currentPlayer === 1 && gameActive) scheduleAIShots();
            }

            function shoot() {
                if (!gameActive || players[currentPlayer].shotsLeft <= 0) return;
                const now = performance.now();
                if (now - lastShotTime < 300) return;
                lastShotTime = now;

                players[currentPlayer].shotsLeft--;

                // Wind divergence: 1 knot = 10 pixels offset
                const DIVERGENCE_PX_PER_KNOT = 10;
                const offsetX = wind.dx * DIVERGENCE_PX_PER_KNOT;
                const offsetY = wind.dy * DIVERGENCE_PX_PER_KNOT;
                const bulletX = mouseX + offsetX;
                const bulletY = mouseY + offsetY;

                // ** NEW: Add bullet mark at landing point **
                shotMarks.push({ x: bulletX, y: bulletY });

                const hit = bottle.alive &&
                    bulletX > bottle.x - bottle.w/2 && bulletX < bottle.x + bottle.w/2 &&
                    bulletY > bottle.y - bottle.h/2 && bulletY < bottle.y + bottle.h/2;

                if (hit) {
                    bottle.alive = false;
                    players[currentPlayer].hits++;
                    floatingTexts.push({ text: '+1', x: bottle.x, y: bottle.y-45, life:1.2, color:'#FFD700' });
                    for (let i=0;i<20;i++) particles.push({
                        x: bottle.x, y: bottle.y, vx: (Math.random()-0.5)*500, vy: (Math.random()-0.8)*450,
                        life:0.6+Math.random()*0.7, maxLife:1.3, size:2+Math.random()*6, color:'#2d8a4e'
                    });
                    notify(players[currentPlayer].name + ' ' + t('GH.bottleDuel.hit', 'hit!'), 'success');
                } else {
                    floatingTexts.push({ text: t('GH.bottleDuel.miss', 'Miss'), x: bulletX, y: bulletY-20, life:1.0, color:'#FF4D6D' });
                }

                updateHUD();
                if (players[currentPlayer].shotsLeft <= 0) {
                    if (currentMode === 'warmup') endGame();
                    else if (currentPlayer === 1 || (currentMode === 'ai' && currentPlayer === 0)) endGame();
                    else setTimeout(switchTurn, 1000);
                } else if (!bottle.alive) {
                    setTimeout(() => { resetBottle(); generateWind(); }, 800);
                }
            }

            function scheduleAIShots() {
                if (aiTimeout) clearTimeout(aiTimeout);
                let shotIndex = 0;
                function doShot() {
                    if (!gameActive || currentPlayer !== 1 || shotIndex >= MAX_SHOTS) return;
                    // AI aims directly at bottle (no wind offset, but we'll simulate a mark at bottle center)
                    const bulletX = bottle.x;
                    const bulletY = bottle.y;
                    shotMarks.push({ x: bulletX, y: bulletY });

                    const acc = currentDifficulty === 'easy' ? 0.3 : currentDifficulty === 'medium' ? 0.6 : 0.9;
                    if (Math.random() < acc && bottle.alive) {
                        bottle.alive = false;
                        players[1].hits++;
                        floatingTexts.push({ text:'+1', x:bottle.x, y:bottle.y-45, life:1.2, color:'#FFD700' });
                        for (let i=0;i<20;i++) particles.push({
                            x:bottle.x, y:bottle.y, vx:(Math.random()-0.5)*500, vy:(Math.random()-0.8)*450,
                            life:0.6+Math.random()*0.7, maxLife:1.3, size:2+Math.random()*6, color:'#2d8a4e'
                        });
                    }
                    players[1].shotsLeft--;
                    shotIndex++;
                    updateHUD();
                    if (!bottle.alive && shotIndex < MAX_SHOTS) {
                        setTimeout(() => { resetBottle(); generateWind(); aiTimeout = setTimeout(doShot, 400); }, 600);
                    } else if (shotIndex < MAX_SHOTS) {
                        aiTimeout = setTimeout(doShot, 350 + Math.random()*400);
                    } else {
                        endGame();
                    }
                }
                aiTimeout = setTimeout(doShot, 500);
            }

            function endGame() {
                gameActive = false;
                if (aiTimeout) clearTimeout(aiTimeout);
                document.getElementById('crosshair').style.display = 'none';
                document.getElementById('gameOverModal').classList.add('active');
                let title = '', msg = '';
                if (currentMode === 'warmup') {
                    title = t('GH.bottleDuel.warmupEnd', 'Practice Over');
                    msg = t('GH.bottleDuel.warmupResult', 'You hit the bottle {0} times.').replace('{0}', players[0].hits);
                } else {
                    if (players[0].hits > players[1].hits) {
                        title = t('GH.bottleDuel.victory', 'Victory!');
                        msg = players[0].name + ' ' + t('GH.bottleDuel.wins', 'Wins!');
                    } else if (players[1].hits > players[0].hits) {
                        title = t('GH.bottleDuel.defeat', 'Defeat!');
                        msg = players[1].name + ' ' + t('GH.bottleDuel.wins', 'Wins!');
                    } else {
                        title = t('GH.bottleDuel.tie', 'Tie!');
                        msg = t('GH.bottleDuel.tieMsg', 'It\'s a tie!');
                    }
                }
                document.getElementById('gameOverTitle').textContent = title;
                document.getElementById('gameOverMessage').textContent = msg;
                document.getElementById('finalP1Hits').textContent = players[0].hits;
                const p2Stat = document.getElementById('finalP2Stat');
                if (currentMode === 'pvp' || currentMode === 'ai') {
                    p2Stat.style.display = '';
                    document.getElementById('finalP2Hits').textContent = players[1].hits;
                } else p2Stat.style.display = 'none';
                document.getElementById('finalShots').textContent = MAX_SHOTS * (currentMode==='warmup'?1:2);
                document.getElementById('gameHUD').style.display = 'none';
            }

            function startSession() {
                gameActive = true;
                players[0] = { name: t('GH.bottleDuel.player1', 'Player 1'), hits:0, shotsLeft:MAX_SHOTS };
                players[1] = { name: currentMode==='ai' ? 'AI Bot' : t('GH.bottleDuel.player2', 'Player 2'), hits:0, shotsLeft:MAX_SHOTS };
                currentPlayer = 0;
                resetBottle();
                generateWind();
                particles = [];
                floatingTexts = [];
                // ** Clear shot marks **
                shotMarks = [];
                document.getElementById('gameHUD').style.display = 'block';
                document.getElementById('mainMenuModal').classList.remove('active');
                document.getElementById('gameOverModal').classList.remove('active');
                document.getElementById('crosshair').style.display = 'block';
                updateHUD();
                if (currentMode === 'ai' && currentPlayer === 1) scheduleAIShots();
                notify(t('GH.bottleDuel.gameStarted', 'Game started!'), 'info');
            }

            function returnToMenu() {
                gameActive = false;
                if (aiTimeout) clearTimeout(aiTimeout);
                document.getElementById('gameHUD').style.display = 'none';
                document.getElementById('gameOverModal').classList.remove('active');
                document.getElementById('mainMenuModal').classList.add('active');
                document.getElementById('crosshair').style.display = 'none';
            }

            // ---------- RENDERING ----------
            function update(dt) {
                if (!gameActive) return;
                if (bottle.alive) {
                    bottle.vx += wind.dx * 0.7 * dt;
                    bottle.vx *= 0.998;
                    bottle.x += bottle.vx * dt;
                    if (bottle.x < BOTTLE_MIN_X) { bottle.x = BOTTLE_MIN_X; bottle.vx *= -0.4; }
                    if (bottle.x > BOTTLE_MAX_X) { bottle.x = BOTTLE_MAX_X; bottle.vx *= -0.4; }
                }
                particles = particles.filter(p => { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=500*dt; p.life-=dt; return p.life>0; });
                floatingTexts = floatingTexts.filter(ft => { ft.y-=60*dt; ft.life-=dt; return ft.life>0; });
                // Shot marks are permanent – no update needed
            }

            function drawScene() {
                ctx.clearRect(0,0,logicalW,logicalH);
                const isDark = document.body.classList.contains('GH-dark-mode');
                // Wooden wall
                ctx.fillStyle = isDark ? '#3a2a1a' : '#c9a87c';
                ctx.fillRect(0,0,logicalW,logicalH);
                // Planks
                ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)';
                ctx.lineWidth = 1;
                for(let i=0;i<logicalW;i+=60) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,logicalH); ctx.stroke(); }
                // Shelf
                ctx.fillStyle = '#8B5E3C';
                ctx.fillRect(0, bottle.y+bottle.h/2+20, logicalW, 22);
                ctx.fillStyle = '#5C3A21';
                ctx.fillRect(0, bottle.y+bottle.h/2+20, logicalW, 4);
                // Shelf brackets
                for(let bx=140; bx<logicalW-40; bx+=180) {
                    ctx.fillStyle = '#5C3A21';
                    ctx.beginPath(); ctx.moveTo(bx, bottle.y+bottle.h/2+20); ctx.lineTo(bx-12, bottle.y+bottle.h/2+42); ctx.lineTo(bx+12, bottle.y+bottle.h/2+42); ctx.fill();
                }
                // Bottle
                if (bottle.alive) drawBottle(bottle.x, bottle.y, bottle.w, bottle.h);
                // Particles
                particles.forEach(p => {
                    ctx.globalAlpha = Math.max(0, p.life/p.maxLife);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
                });
                ctx.globalAlpha = 1;
                // Floating texts
                floatingTexts.forEach(ft => {
                    ctx.globalAlpha = Math.max(0, ft.life/1.2);
                    ctx.fillStyle = ft.color;
                    ctx.font = 'bold 18px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, ft.x, ft.y);
                });
                ctx.globalAlpha = 1;

                // ** DRAW BULLET HOLES **
                shotMarks.forEach(m => {
                    ctx.beginPath();
                    ctx.arc(m.x, m.y, 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fill();
                    ctx.strokeStyle = '#888';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    // Inner darker hole
                    ctx.beginPath();
                    ctx.arc(m.x, m.y, 1.8, 0, Math.PI * 2);
                    ctx.fillStyle = '#000';
                    ctx.fill();
                });

                // Gun (now an image)
                drawGun();
            }

            // --- MODIFIED: drawBottle now uses the random bottle image ---
            function drawBottle(x, y, w, h) {
                ctx.save(); ctx.translate(x, y);
                // Shadow ellipse (same as original)
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath(); ctx.ellipse(0, h/2, w/2+2, 6, 0, 0, Math.PI*2); ctx.fill();

                // Draw the randomly selected bottle image if loaded, otherwise fallback
                if (bottle.image && bottle.image.complete && bottle.image.naturalWidth > 0) {
                    const img = bottle.image;
                    const targetW = w;
                    const targetH = h;
                    const scale = Math.min(targetW / img.naturalWidth, targetH / img.naturalHeight);
                    const drawW = img.naturalWidth * scale;
                    const drawH = img.naturalHeight * scale;
                    const dx = -drawW / 2;
                    const dy = -drawH / 2;
                    ctx.drawImage(img, dx, dy, drawW, drawH);
                } else {
                    // Original drawn bottle as fallback (unchanged)
                    const grad = ctx.createLinearGradient(-w/2,0,w/2,0);
                    grad.addColorStop(0,'#1e6b38'); grad.addColorStop(0.5,'#44aa66'); grad.addColorStop(1,'#2d8a4e');
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, w*0.3); ctx.fill();
                    ctx.strokeStyle = '#111'; ctx.lineWidth=2; ctx.stroke();
                    ctx.fillStyle = '#1e5a30'; ctx.fillRect(-w*0.2, -h/2-20, w*0.4, 20);
                    ctx.strokeRect(-w*0.2, -h/2-20, w*0.4, 20);
                    ctx.fillStyle = 'white'; ctx.fillRect(-w*0.3, -8, w*0.6, 24);
                    ctx.fillStyle = '#222'; ctx.font = '14px sans-serif'; ctx.textAlign='center'; ctx.fillText('🍺', 0, 8);
                }
                ctx.restore();
            }

            function drawGun() {
                const gx = logicalW/2, gy = logicalH-30;
                ctx.save();
                ctx.translate(gx, gy);
                // Only draw the image if it's loaded
                if (gunImage.complete && gunImage.naturalWidth > 0) {
                    // Resize to approximate original gun dimensions
                    ctx.drawImage(gunImage, -54, -26, 120, 80);
                }
                ctx.restore();
            }

            // ---------- EVENTS ----------
            function mouseMove(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = logicalW/rect.width, scaleY = logicalH/rect.height;
                const cx = e.touches? e.touches[0].clientX : e.clientX;
                const cy = e.touches? e.touches[0].clientY : e.clientY;
                mouseX = (cx - rect.left)*scaleX; mouseY = (cy - rect.top)*scaleY;
                const ch = document.getElementById('crosshair');
                ch.style.left = (cx - rect.left) + 'px';
                ch.style.top = (cy - rect.top) + 'px';
            }

            canvas.addEventListener('mousemove', mouseMove);
            canvas.addEventListener('click', (e)=>{ mouseMove(e); shoot(); });
            canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); mouseMove(e); }, {passive:false});
            canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); mouseMove(e); shoot(); }, {passive:false});
            document.getElementById('gameArea').addEventListener('mouseenter', ()=>{ if(gameActive) document.getElementById('crosshair').style.display='block'; });
            document.getElementById('gameArea').addEventListener('mouseleave', ()=>{ document.getElementById('crosshair').style.display='none'; });

            document.getElementById('startGameBtn').addEventListener('click', ()=>{
                currentMode = document.querySelector('.GH-mode-btn.active')?.dataset.mode || 'warmup';
                currentDifficulty = document.querySelector('.GH-diff-btn.active')?.dataset.diff || 'easy';
                startSession();
            });
            document.getElementById('rematchButton').addEventListener('click', startSession);
            document.getElementById('menuButton').addEventListener('click', returnToMenu);
            document.getElementById('modalRematch').addEventListener('click', ()=>{ document.getElementById('gameOverModal').classList.remove('active'); startSession(); });
            document.getElementById('modalMenu').addEventListener('click', ()=>{ document.getElementById('gameOverModal').classList.remove('active'); returnToMenu(); });
            document.querySelectorAll('.GH-mode-btn').forEach(b=>b.addEventListener('click', function(){ document.querySelectorAll('.GH-mode-btn').forEach(x=>x.classList.remove('active')); this.classList.add('active'); }));
            document.querySelectorAll('.GH-diff-btn').forEach(b=>b.addEventListener('click', function(){ document.querySelectorAll('.GH-diff-btn').forEach(x=>x.classList.remove('active')); this.classList.add('active'); }));

            function gameLoop(ts) {
                const dt = Math.min(0.05, (ts - (gameLoop.lastTs||ts))/1000);
                gameLoop.lastTs = ts;
                update(dt);
                drawScene();
                animationId = requestAnimationFrame(gameLoop);
            }
            gameLoop.lastTs = performance.now();
            animationId = requestAnimationFrame(gameLoop);

            document.getElementById('languageSelect').addEventListener('change', function(){
                if(window.setLanguage) window.setLanguage(this.value);
                updateAllTexts();
                if(gameActive) updateHUD();
            });
            document.getElementById('modeToggle').addEventListener('click', function(){
                document.body.classList.toggle('GH-dark-mode');
                const icon = this.querySelector('.GH-icon');
                if(icon) icon.textContent = document.body.classList.contains('GH-dark-mode') ? '☀️' : '🌙';
            });
            document.getElementById('notificationToggle').addEventListener('click', function(){
                this.classList.toggle('GH-notifications-off');
                const icon = this.querySelector('.GH-icon');
                if(icon) icon.textContent = this.classList.contains('GH-notifications-off') ? '🔕' : '🔔';
            });

            updateAllTexts();
            drawScene();
        })();
    </script>
