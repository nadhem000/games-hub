    <script>
        // ==================== Damma - Checkers Game Logic ====================
        (function() {
            const BOARD_SIZE = 8;
            const PLAYER_1 = 1;
            const PLAYER_2 = 2;
            const MAX_HISTORY = 60;

            // ---------- Translation helper (same as other games) ----------
            function t(key, fallback = '') {
                const translations = window.getTranslations ? window.getTranslations() : {};
                const cleanKey = key.startsWith('GH.') ? key.slice(3) : key;
                const parts = cleanKey.split('.');
                let val = translations;
                for (let p of parts) {
                    if (val && typeof val === 'object') val = val[p];
                    else { val = undefined; break; }
                }
                return (typeof val === 'string') ? val : fallback;
            }

            let audioCtx = null;

            function ensureAudioContext() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            // ---- Sound Effects ----
            function playClickSound() {
                try {
                    const ctx = ensureAudioContext();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.06);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.1);
                } catch (e) {}
            }

            function playCaptureSound() {
                try {
                    const ctx = ensureAudioContext();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.35, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.22);
                } catch (e) {}
            }

            function playCoronationSound() {
                try {
                    const ctx = ensureAudioContext();
                    const notes = [523.25, 659.25, 783.99];
                    const duration = 0.1;
                    const gap = 0.06;
                    let time = ctx.currentTime;
                    notes.forEach(freq => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.3, time);
                        gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(time);
                        osc.stop(time + duration + 0.03);
                        time += duration + gap;
                    });
                } catch (e) {}
            }

            function playSound(type) {
                try {
                    const ctx = ensureAudioContext();
                    const notes = {
                        win: [523.25, 659.25, 783.99, 1046.5],
                        lose: [392, 349.23, 330, 261.63],
                        draw: [440, 440]
                    };
                    const sequence = notes[type] || notes.draw;
                    const duration = type === 'draw' ? 0.25 : 0.18;
                    const gap = 0.08;
                    let time = ctx.currentTime;
                    sequence.forEach(freq => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.25, time);
                        gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(time);
                        osc.stop(time + duration + 0.05);
                        time += duration + gap;
                    });
                } catch (e) {}
            }

            // ---- Haptic Feedback ----
            function haptic(type) {
                if (typeof navigator !== 'undefined' && navigator.vibrate) {
                    switch (type) {
                        case 'move':
                            navigator.vibrate(12);
                            break;
                        case 'capture':
                            navigator.vibrate(30);
                            break;
                        case 'coronation':
                            navigator.vibrate([15, 30, 15]);
                            break;
                        case 'select':
                            navigator.vibrate(8);
                            break;
                        case 'invalid':
                            navigator.vibrate([20, 50, 20]);
                            break;
                        default:
                            navigator.vibrate(10);
                    }
                }
            }

            // ---- Game State ----
            let board = [];
            let currentPlayer = PLAYER_1;
            let selectedRow = -1,
                selectedCol = -1;
            let validMoves = [];
            let captureInProgress = false;
            let gameOver = false;
            let scores = { [PLAYER_1]: 12, [PLAYER_2]: 12 };
            let aiTimeout = null;
            let moveHistory = [];
            let focusRow = -1,
                focusCol = -1;
            let recentlyCaptured = new Set();
            let recentlyCoronated = null;
            let recentlyMoved = null;

            // ---- Game Settings ----
            let gameSettings = {
                variant: 1,
                stalemateDraw: true,
                player1Name: 'Player 1',
                player2Name: 'Player 2',
                forceCapture: true,
                flyingKings: false,
                backwardCapture: false,
                startingPosition: 'standard',
                vsAI: false,
                aiDifficulty: 'medium'
            };

            // ---- DOM refs ----
            const boardEl = document.getElementById('dmBoard');
            const boardWrapper = document.getElementById('dmBoardWrapper');
            const gameContainer = document.getElementById('dmGameContainer');
            const turnIndicator = document.getElementById('dmTurnIndicator');
            const thinkingIndicator = document.getElementById('dmThinkingIndicator');
            const gameStatus = document.getElementById('dmGameStatus');
            const player1Info = document.getElementById('dmPlayer1Info');
            const player2Info = document.getElementById('dmPlayer2Info');
            const score1El = document.getElementById('dmScore1');
            const score2El = document.getElementById('dmScore2');
            const player1NameDisplay = document.getElementById('dmPlayer1NameDisplay');
            const player2NameDisplay = document.getElementById('dmPlayer2NameDisplay');
            const newGameBtn = document.getElementById('dmNewGameBtn');
            const settingsBtn = document.getElementById('dmSettingsBtn');
            const undoBtn = document.getElementById('dmUndoBtn');
            const settingsSummary = document.getElementById('dmSettingsSummary');
            const effectsContainer = document.getElementById('dmEffectsContainer');
            let boardSquares = [];

            // ---- Modal handling ----
            const startModal = document.getElementById('dmStartModal');
            const vsAICheckbox = document.getElementById('dmVsAI');
            const aiDifficultyRow = document.getElementById('dmAiDifficultyRow');
            const p2NameRow = document.getElementById('dmP2NameRow');
            const p2NameInput = document.getElementById('dmP2Name');
            const closeModalBtn = document.getElementById('dmCloseModalBtn');

            function updateModalUI() {
                document.querySelector('input[name="dmVariant"][value="' + gameSettings.variant + '"]').checked = true;
                document.getElementById('dmStalemateDraw').checked = gameSettings.stalemateDraw;
                document.getElementById('dmForceCapture').checked = gameSettings.forceCapture;
                document.getElementById('dmBackwardCapture').checked = gameSettings.backwardCapture;
                document.querySelector('input[name="dmKingMove"][value="' + (gameSettings.flyingKings ? 'flying' :
                    'single') + '"]').checked = true;
                document.querySelector('input[name="dmStartPos"][value="' + gameSettings.startingPosition + '"]').checked =
                    true;
                document.getElementById('dmP1Name').value = gameSettings.player1Name;
                vsAICheckbox.checked = gameSettings.vsAI;
                if (gameSettings.vsAI) {
                    aiDifficultyRow.style.display = 'block';
                    p2NameRow.style.display = 'none';
                    document.getElementById('dmAiDifficulty').value = gameSettings.aiDifficulty;
                } else {
                    aiDifficultyRow.style.display = 'none';
                    p2NameRow.style.display = 'block';
                    p2NameInput.value = gameSettings.player2Name;
                }
            }

            vsAICheckbox.addEventListener('change', function() {
                if (this.checked) {
                    aiDifficultyRow.style.display = 'block';
                    p2NameRow.style.display = 'none';
                } else {
                    aiDifficultyRow.style.display = 'none';
                    p2NameRow.style.display = 'block';
                }
            });

            function applySettingsFromModal() {
                gameSettings.variant = parseInt(document.querySelector('input[name="dmVariant"]:checked').value);
                gameSettings.stalemateDraw = document.getElementById('dmStalemateDraw').checked;
                gameSettings.player1Name = document.getElementById('dmP1Name').value.trim() || 'Player 1';
                gameSettings.forceCapture = document.getElementById('dmForceCapture').checked;
                gameSettings.flyingKings = document.querySelector('input[name="dmKingMove"]:checked').value === 'flying';
                gameSettings.backwardCapture = document.getElementById('dmBackwardCapture').checked;
                gameSettings.startingPosition = document.querySelector('input[name="dmStartPos"]:checked').value;
                gameSettings.vsAI = vsAICheckbox.checked;
                gameSettings.aiDifficulty = document.getElementById('dmAiDifficulty').value;
                if (!gameSettings.vsAI) {
                    gameSettings.player2Name = document.getElementById('dmP2Name').value.trim() || 'Player 2';
                } else {
                    gameSettings.player2Name = 'AI (' + gameSettings.aiDifficulty.charAt(0).toUpperCase() + gameSettings
                        .aiDifficulty.slice(1) + ')';
                }
            }

            function openSettingsModal() {
                updateModalUI();
                startModal.style.display = 'flex';
            }

            function closeSettingsModal() {
                startModal.style.display = 'none';
            }

            document.getElementById('dmStartGameBtn').addEventListener('click', () => {
                ensureAudioContext();
                applySettingsFromModal();
                closeSettingsModal();
                resetGame();
            });

            closeModalBtn.addEventListener('click', closeSettingsModal);
            settingsBtn.addEventListener('click', openSettingsModal);

            // ---- Theme Sync with GameHub ----
            function syncThemeWithSite() {
                const isDark = document.body.classList.contains('GH-dark-mode');
                gameContainer.setAttribute('data-theme', isDark ? 'dark' : 'light');
            }

            // Initial sync
            syncThemeWithSite();

            // Watch for mode toggle clicks
            const modeToggle = document.getElementById('modeToggle');
            if (modeToggle) {
                modeToggle.addEventListener('click', () => {
                    setTimeout(syncThemeWithSite, 60);
                });
            }

            // Also observe body class changes
            const bodyObserver = new MutationObserver(() => {
                syncThemeWithSite();
            });
            bodyObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });

            // ---- History / Undo ----
            function snapshotState() {
                return {
                    board: board.map(r => [...r]),
                    scores: { ...scores },
                    currentPlayer,
                    gameOver,
                    captureInProgress,
                    selectedRow,
                    selectedCol,
                    validMoves: validMoves.map(m => ({ ...m, captures: (m.captures || []).map(c => ({ ...c })) }))
                };
            }

            function pushHistory() {
                moveHistory.push(snapshotState());
                if (moveHistory.length > MAX_HISTORY) moveHistory.shift();
                undoBtn.disabled = false;
            }

            function undoMove() {
                if (moveHistory.length === 0) return;
                clearAITimeout();
                const state = moveHistory.pop();
                board = state.board;
                scores = state.scores;
                currentPlayer = state.currentPlayer;
                gameOver = state.gameOver;
                captureInProgress = state.captureInProgress;
                selectedRow = state.selectedRow;
                selectedCol = state.selectedCol;
                validMoves = state.validMoves;
                gameStatus.textContent = '';
                recentlyCaptured.clear();
                recentlyCoronated = null;
                recentlyMoved = null;
                clearEffects();
                if (moveHistory.length === 0) undoBtn.disabled = true;
                updateUI();
                renderBoard(true);
                updateFocusToCurrentPlayer();
                triggerAIMoveIfNeeded();
            }

            undoBtn.addEventListener('click', undoMove);

            // ---- Utility functions ----
            function isDarkSquare(row, col) { return (row + col) % 2 === 1; }

            function inBounds(row, col) { return row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE; }

            function getPiecePlayerOnBoard(boardState, r, c) {
                const p = boardState[r][c];
                if (p === PLAYER_1 || p === 3) return PLAYER_1;
                if (p === PLAYER_2 || p === 4) return PLAYER_2;
                return 0;
            }

            function isKing(piece) { return piece === 3 || piece === 4; }

            function getPiecePlayer(row, col) { return getPiecePlayerOnBoard(board, row, col); }

            // ---- Move generation ----
            function getCaptureMovesOnBoard(boardState, row, col) {
                const piece = boardState[row][col];
                const player = getPiecePlayerOnBoard(boardState, row, col);
                if (player === 0) return [];
                const king = isKing(piece);
                const opponent = player === PLAYER_1 ? PLAYER_2 : PLAYER_1;
                const moves = [];
                if (king && gameSettings.flyingKings) {
                    const dirs = [
                        [-1, -1],
                        [-1, 1],
                        [1, -1],
                        [1, 1]
                    ];
                    for (const [dr, dc] of dirs) {
                        for (let step = 1;; step++) {
                            const mr = row + step * dr,
                                mc = col + step * dc;
                            if (!inBounds(mr, mc) || !isDarkSquare(mr, mc)) break;
                            const p = boardState[mr][mc];
                            if (p === 0) continue;
                            if (getPiecePlayerOnBoard(boardState, mr, mc) === opponent) {
                                const lr = mr + dr,
                                    lc = mc + dc;
                                if (inBounds(lr, lc) && isDarkSquare(lr, lc) && boardState[lr][lc] === 0) {
                                    moves.push({ toRow: lr, toCol: lc, capturedRow: mr, capturedCol: mc });
                                }
                                break;
                            } else break;
                        }
                    }
                } else {
                    const rowDirsCapture = (king || gameSettings.backwardCapture) ? [-1, 1] : (player === PLAYER_1 ? [-1] : [
                        1
                    ]);
                    const colDirs = [-1, 1];
                    for (const dr of rowDirsCapture) {
                        for (const dc of colDirs) {
                            const mr = row + dr,
                                mc = col + dc;
                            const lr = row + 2 * dr,
                                lc = col + 2 * dc;
                            if (!inBounds(lr, lc) || !isDarkSquare(lr, lc)) continue;
                            if (getPiecePlayerOnBoard(boardState, mr, mc) === opponent && boardState[lr][lc] === 0) {
                                moves.push({ toRow: lr, toCol: lc, capturedRow: mr, capturedCol: mc });
                            }
                        }
                    }
                }
                return moves;
            }

            function buildCaptureSequences(boardState, fromRow, fromCol, player, currentPath = [], allSequences = []) {
                const caps = getCaptureMovesOnBoard(boardState, fromRow, fromCol);
                if (caps.length === 0) {
                    if (currentPath.length > 0) allSequences.push([...currentPath]);
                    return allSequences;
                }
                for (const cap of caps) {
                    const newBoard = boardState.map(r => [...r]);
                    newBoard[cap.capturedRow][cap.capturedCol] = 0;
                    const movingPiece = newBoard[fromRow][fromCol];
                    newBoard[cap.toRow][cap.toCol] = movingPiece;
                    newBoard[fromRow][fromCol] = 0;
                    if (player === PLAYER_1 && cap.toRow === 0 && movingPiece === PLAYER_1) newBoard[cap.toRow][cap.toCol] =
                        3;
                    if (player === PLAYER_2 && cap.toRow === BOARD_SIZE - 1 && movingPiece === PLAYER_2) newBoard[cap.toRow][
                        cap.toCol
                    ] = 4;
                    if (gameSettings.variant === 2 && newBoard[cap.toRow][cap.toCol] !== movingPiece && !isKing(
                            movingPiece)) {
                        allSequences.push([...currentPath, cap]);
                        continue;
                    }
                    currentPath.push(cap);
                    buildCaptureSequences(newBoard, cap.toRow, cap.toCol, player, currentPath, allSequences);
                    currentPath.pop();
                }
                return allSequences;
            }

            function maxCaptureFromBoardCopy(boardState, row, col, player, visited = new Set()) {
                const key = `${row},${col}`;
                if (visited.has(key)) return 0;
                visited.add(key);
                const caps = getCaptureMovesOnBoard(boardState, row, col);
                let maxC = 0;
                for (const cap of caps) {
                    const newBoard = boardState.map(r => [...r]);
                    newBoard[cap.capturedRow][cap.capturedCol] = 0;
                    const p = newBoard[row][col];
                    newBoard[cap.toRow][cap.toCol] = p;
                    newBoard[row][col] = 0;
                    if (player === PLAYER_1 && cap.toRow === 0 && p === PLAYER_1) newBoard[cap.toRow][cap.toCol] = 3;
                    if (player === PLAYER_2 && cap.toRow === BOARD_SIZE - 1 && p === PLAYER_2) newBoard[cap.toRow][cap.toCol] =
                        4;
                    maxC = Math.max(maxC, 1 + maxCaptureFromBoardCopy(newBoard, cap.toRow, cap.toCol, player, new Set(
                        visited)));
                }
                visited.delete(key);
                return maxC;
            }

            function getGlobalMaxCaptures(player) {
                const boardCopy = board.map(r => [...r]);
                let globalMax = 0;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (getPiecePlayerOnBoard(boardCopy, r, c) === player) {
                            globalMax = Math.max(globalMax, maxCaptureFromBoardCopy(boardCopy, r, c, player));
                        }
                    }
                }
                return globalMax;
            }

            function getValidMovesForPiece(row, col, includeAll = false) {
                const piece = board[row][col];
                const player = getPiecePlayer(row, col);
                if (player === 0) return [];
                const king = isKing(piece);
                const opponent = player === PLAYER_1 ? PLAYER_2 : PLAYER_1;
                const captures = [];
                const normals = [];
                if (king && gameSettings.flyingKings) {
                    const dirs = [
                        [-1, -1],
                        [-1, 1],
                        [1, -1],
                        [1, 1]
                    ];
                    for (const [dr, dc] of dirs) {
                        for (let step = 1;; step++) {
                            const nr = row + step * dr,
                                nc = col + step * dc;
                            if (!inBounds(nr, nc) || !isDarkSquare(nr, nc)) break;
                            if (board[nr][nc] === 0) {
                                normals.push({ row: nr, col: nc, isCapture: false, captures: [] });
                            } else {
                                if (getPiecePlayer(nr, nc) === opponent) {
                                    const landRow = nr + dr,
                                        landCol = nc + dc;
                                    if (inBounds(landRow, landCol) && isDarkSquare(landRow, landCol) && board[landRow][
                                            landCol
                                        ] === 0) {
                                        captures.push({ row: landRow, col: landCol, isCapture: true,
                                            captures: [{ row: nr, col: nc }] });
                                    }
                                }
                                break;
                            }
                        }
                    }
                } else {
                    const rowDirsNormal = (king) ? [-1, 1] : (player === PLAYER_1 ? [-1] : [1]);
                    const rowDirsCapture = (king || gameSettings.backwardCapture) ? [-1, 1] : rowDirsNormal;
                    const colDirs = [-1, 1];
                    for (const dr of rowDirsNormal) {
                        for (const dc of colDirs) {
                            const nr = row + dr,
                                nc = col + dc;
                            if (inBounds(nr, nc) && isDarkSquare(nr, nc) && board[nr][nc] === 0) {
                                normals.push({ row: nr, col: nc, isCapture: false, captures: [] });
                            }
                        }
                    }
                    for (const dr of rowDirsCapture) {
                        for (const dc of colDirs) {
                            const midRow = row + dr,
                                midCol = col + dc;
                            const landRow = row + 2 * dr,
                                landCol = col + 2 * dc;
                            if (inBounds(landRow, landCol) && isDarkSquare(landRow, landCol)) {
                                if (getPiecePlayer(midRow, midCol) === opponent && board[landRow][landCol] === 0) {
                                    captures.push({ row: landRow, col: landCol, isCapture: true,
                                        captures: [{ row: midRow, col: midCol }] });
                                }
                            }
                        }
                    }
                }
                if (includeAll) return captures.concat(normals);
                return captures.length > 0 ? captures : normals;
            }

            function getAllValidMovesForPlayer(player) {
                const captures = [];
                const normals = [];
                let hasAnyCapture = false;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (getPiecePlayer(r, c) !== player) continue;
                        const pieceMoves = getValidMovesForPiece(r, c, true);
                        for (const move of pieceMoves) {
                            if (move.isCapture) {
                                captures.push({ fromRow: r, fromCol: c, ...move });
                                hasAnyCapture = true;
                            } else {
                                normals.push({ fromRow: r, fromCol: c, ...move });
                            }
                        }
                    }
                }
                if (!hasAnyCapture || !gameSettings.forceCapture) return captures.concat(normals);
                if (gameSettings.variant === 1) {
                    const maxCap = getGlobalMaxCaptures(player);
                    return captures.filter(m => {
                        const boardCopy = board.map(r => [...r]);
                        const piece = boardCopy[m.fromRow][m.fromCol];
                        boardCopy[m.fromRow][m.fromCol] = 0;
                        boardCopy[m.row][m.col] = piece;
                        boardCopy[m.captures[0].row][m.captures[0].col] = 0;
                        if (player === PLAYER_1 && m.row === 0 && piece === PLAYER_1) boardCopy[m.row][m.col] = 3;
                        if (player === PLAYER_2 && m.row === BOARD_SIZE - 1 && piece === PLAYER_2) boardCopy[m.row][m.col] =
                            4;
                        const remaining = maxCaptureFromBoardCopy(boardCopy, m.row, m.col, player);
                        return 1 + remaining === maxCap;
                    });
                }
                return captures;
            }

            function getContinuationMoves(fromRow, fromCol) {
                const moves = getValidMovesForPiece(fromRow, fromCol, true);
                const captureMoves = moves.filter(m => m.isCapture);
                if (!gameSettings.forceCapture || captureMoves.length === 0) return captureMoves.concat(moves.filter(m => !m
                    .isCapture));
                if (gameSettings.variant === 1) {
                    const boardCopy = board.map(r => [...r]);
                    const player = getPiecePlayerOnBoard(boardCopy, fromRow, fromCol);
                    const maxFromHere = maxCaptureFromBoardCopy(boardCopy, fromRow, fromCol, player);
                    return captureMoves.filter(m => {
                        const simBoard = board.map(r => [...r]);
                        const p = simBoard[fromRow][fromCol];
                        simBoard[fromRow][fromCol] = 0;
                        simBoard[m.captures[0].row][m.captures[0].col] = 0;
                        simBoard[m.row][m.col] = p;
                        if (player === PLAYER_1 && m.row === 0 && p === PLAYER_1) simBoard[m.row][m.col] = 3;
                        if (player === PLAYER_2 && m.row === BOARD_SIZE - 1 && p === PLAYER_2) simBoard[m.row][m.col] = 4;
                        const remaining = maxCaptureFromBoardCopy(simBoard, m.row, m.col, player);
                        return 1 + remaining === maxFromHere;
                    });
                }
                return captureMoves;
            }

            // ---- Execute move ----
            function executeMove(fromRow, fromCol, toRow, toCol, captures) {
                const piece = board[fromRow][fromCol];
                const wasKing = isKing(piece);
                board[toRow][toCol] = piece;
                board[fromRow][fromCol] = 0;
                recentlyCaptured.clear();
                recentlyCoronated = null;
                recentlyMoved = { row: toRow, col: toCol };
                for (const cap of captures) {
                    const capPlayer = getPiecePlayer(cap.row, cap.col);
                    if (capPlayer !== 0) scores[capPlayer]--;
                    board[cap.row][cap.col] = 0;
                    recentlyCaptured.add(`${cap.row},${cap.col}`);
                }
                const player = getPiecePlayer(toRow, toCol);
                if (player === PLAYER_1 && toRow === 0 && piece === PLAYER_1) {
                    board[toRow][toCol] = 3;
                    if (!wasKing) recentlyCoronated = { row: toRow, col: toCol };
                }
                if (player === PLAYER_2 && toRow === BOARD_SIZE - 1 && piece === PLAYER_2) {
                    board[toRow][toCol] = 4;
                    if (!wasKing) recentlyCoronated = { row: toRow, col: toCol };
                }
                if (captures.length > 0) {
                    playCaptureSound();
                    haptic('capture');
                } else {
                    playClickSound();
                    haptic('move');
                }
                if (recentlyCoronated) {
                    setTimeout(() => playCoronationSound(), 150);
                    haptic('coronation');
                }
            }

            // ---------- Translation-aware win/end functions ----------
            function checkWinCondition() {
                const p1 = scores[PLAYER_1], p2 = scores[PLAYER_2];
                const name1 = gameSettings.player1Name, name2 = gameSettings.player2Name;
                if (p1 === 0) {
                    let msg = t('GH.damma.playerWins', '{player} Wins!');
                    msg = msg.replace('{player}', name2);
                    endGame(msg);
                    return true;
                }
                if (p2 === 0) {
                    let msg = t('GH.damma.playerWins', '{player} Wins!');
                    msg = msg.replace('{player}', name1);
                    endGame(msg);
                    return true;
                }
                const allMoves = getAllValidMovesForPlayer(currentPlayer);
                if (allMoves.length === 0) {
                    if (gameSettings.stalemateDraw) {
                        let msg = t('GH.damma.drawStalemate', 'Draw! (Stalemate)');
                        endGame(msg);
                    } else {
                        let winnerName = currentPlayer === PLAYER_1 ? name2 : name1;
                        let msg = t('GH.damma.winsNoMoves', '{player} Wins! (No moves)');
                        msg = msg.replace('{player}', winnerName);
                        endGame(msg);
                    }
                    return true;
                }
                return false;
            }

            function endGame(msg) {
                gameOver = true;
                gameStatus.textContent = msg;
                selectedRow = -1;
                selectedCol = -1;
                validMoves = [];
                captureInProgress = false;
                clearAITimeout();
                hideThinkingIndicator();
                turnIndicator.textContent = t('GH.damma.gameOver', 'Game Over');
                if (msg.includes(gameSettings.player1Name) || msg.includes(gameSettings.player2Name)) {
                    const winner = msg.includes(gameSettings.player1Name) ? PLAYER_1 : PLAYER_2;
                    triggerEndEffect(winner);
                } else if (msg.includes('Draw')) {
                    triggerEndEffect(0);
                }
            }

            function switchTurn() {
                currentPlayer = currentPlayer === PLAYER_1 ? PLAYER_2 : PLAYER_1;
                selectedRow = -1;
                selectedCol = -1;
                validMoves = [];
                captureInProgress = false;
                recentlyCaptured.clear();
                recentlyCoronated = null;
                recentlyMoved = null;
                updateFocusToCurrentPlayer();
                updateUITurnText();
            }

            function updateUITurnText() {
                if (gameOver) return;
                const name1 = gameSettings.player1Name;
                const name2 = gameSettings.player2Name;
                if (captureInProgress) {
                    turnIndicator.textContent = t('GH.damma.continueCapturing', '{player} - Continue capturing!')
                        .replace('{player}', currentPlayer === PLAYER_1 ? name1 : name2);
                } else {
                    turnIndicator.textContent = t('GH.damma.turnFormat', '{player}\'s turn')
                        .replace('{player}', currentPlayer === PLAYER_1 ? name1 : name2);
                }
            }

            // ---- Focus management ----
            function updateFocusToCurrentPlayer() {
                if (gameOver) { focusRow = -1;
                    focusCol = -1; return; }
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (getPiecePlayer(r, c) === currentPlayer) {
                            focusRow = r;
                            focusCol = c;
                            return;
                        }
                    }
                }
                focusRow = 3;
                focusCol = 1;
            }

            function moveFocus(dr, dc) {
                if (gameOver) return;
                let nr = focusRow + dr;
                let nc = focusCol + dc;
                if (nr < 0) nr = BOARD_SIZE - 1;
                if (nr >= BOARD_SIZE) nr = 0;
                if (nc < 0) nc = BOARD_SIZE - 1;
                if (nc >= BOARD_SIZE) nc = 0;
                focusRow = nr;
                focusCol = nc;
                renderBoard();
            }

            // ---- Thinking indicator ----
            function showThinkingIndicator() {
                thinkingIndicator.classList.add('visible');
                const textNode = Array.from(thinkingIndicator.childNodes).find(n => n.nodeType === Node.TEXT_NODE);
                if (textNode) textNode.textContent = ' ' + t('GH.damma.aiThinking', 'AI thinking');
            }

            function hideThinkingIndicator() {
                thinkingIndicator.classList.remove('visible');
            }

            // ---- Main click handler (unchanged logic, only translated messages) ----
            function handleSquareClick(row, col) {
                if (gameOver) return;
                if (gameSettings.vsAI && currentPlayer === PLAYER_2) return;

                focusRow = row;
                focusCol = col;

                // Multi-jump continuation
                if (captureInProgress && selectedRow >= 0 && selectedCol >= 0) {
                    const contMoves = getContinuationMoves(selectedRow, selectedCol);
                    const match = contMoves.find(m => m.row === row && m.col === col);
                    if (match) {
                        const pieceBefore = board[selectedRow][selectedCol];
                        const wasKing = isKing(pieceBefore);
                        executeMove(selectedRow, selectedCol, row, col, match.captures);
                        if (scores[PLAYER_1] === 0 || scores[PLAYER_2] === 0) {
                            const winner = scores[PLAYER_1] === 0 ? gameSettings.player2Name : gameSettings.player1Name;
                            let msg = t('GH.damma.playerWins', '{player} Wins!');
                            msg = msg.replace('{player}', winner);
                            endGame(msg);
                            updateUI();
                            renderBoard();
                            return;
                        }
                        const becameKing = (currentPlayer === PLAYER_1 && row === 0) || (currentPlayer === PLAYER_2 && row ===
                            BOARD_SIZE - 1);
                        const stopAfterKing = (gameSettings.variant === 2 && becameKing && !wasKing);
                        if (!stopAfterKing) {
                            const further = getContinuationMoves(row, col).filter(m => m.isCapture);
                            if (further.length > 0) {
                                selectedRow = row;
                                selectedCol = col;
                                validMoves = further;
                                captureInProgress = true;
                            } else {
                                captureInProgress = false;
                                selectedRow = -1;
                                selectedCol = -1;
                                validMoves = [];
                                switchTurn();
                                checkWinCondition();
                            }
                        } else {
                            captureInProgress = false;
                            selectedRow = -1;
                            selectedCol = -1;
                            validMoves = [];
                            switchTurn();
                            checkWinCondition();
                        }
                        updateUI();
                        renderBoard();
                        triggerAIMoveIfNeeded();
                        return;
                    } else {
                        boardWrapper.classList.add('GH-damma-board-shake');
                        setTimeout(() => boardWrapper.classList.remove('GH-damma-board-shake'), 400);
                        haptic('invalid');
                        return;
                    }
                }

                // Normal move / piece selection
                if (selectedRow >= 0 && selectedCol >= 0) {
                    const match = validMoves.find(m => m.row === row && m.col === col);
                    if (match) {
                        const pieceBefore = board[selectedRow][selectedCol];
                        const wasKing = isKing(pieceBefore);
                        executeMove(selectedRow, selectedCol, row, col, match.captures);
                        if (scores[PLAYER_1] === 0 || scores[PLAYER_2] === 0) {
                            const winner = scores[PLAYER_1] === 0 ? gameSettings.player2Name : gameSettings.player1Name;
                            let msg = t('GH.damma.playerWins', '{player} Wins!');
                            msg = msg.replace('{player}', winner);
                            endGame(msg);
                            updateUI();
                            renderBoard();
                            return;
                        }
                        const becameKing = (currentPlayer === PLAYER_1 && row === 0) || (currentPlayer === PLAYER_2 && row ===
                            BOARD_SIZE - 1);
                        const stopAfterKing = (gameSettings.variant === 2 && becameKing && !wasKing);
                        if (match.isCapture && !stopAfterKing) {
                            const further = getContinuationMoves(row, col).filter(m => m.isCapture);
                            if (further.length > 0) {
                                captureInProgress = true;
                                selectedRow = row;
                                selectedCol = col;
                                validMoves = further;
                            } else {
                                switchTurn();
                                checkWinCondition();
                            }
                        } else {
                            selectedRow = -1;
                            selectedCol = -1;
                            validMoves = [];
                            captureInProgress = false;
                            switchTurn();
                            checkWinCondition();
                        }
                        updateUI();
                        renderBoard();
                        triggerAIMoveIfNeeded();
                        return;
                    }
                    if (validMoves.length > 0) {
                        boardWrapper.classList.add('GH-damma-board-shake');
                        setTimeout(() => boardWrapper.classList.remove('GH-damma-board-shake'), 400);
                        haptic('invalid');
                    }
                    selectedRow = -1;
                    selectedCol = -1;
                    validMoves = [];
                    updateUI();
                    renderBoard();
                    return;
                }

                // Selecting own piece
                const clickedPlayer = getPiecePlayer(row, col);
                if (clickedPlayer === currentPlayer && !captureInProgress) {
                    if (selectedRow === row && selectedCol === col) {
                        selectedRow = -1;
                        selectedCol = -1;
                        validMoves = [];
                    } else {
                        const allPlayerMoves = getAllValidMovesForPlayer(currentPlayer);
                        const pieceMoves = allPlayerMoves.filter(m => m.fromRow === row && m.fromCol === col);
                        if (pieceMoves.length > 0) {
                            selectedRow = row;
                            selectedCol = col;
                            validMoves = pieceMoves.map(m => ({ row: m.row, col: m.col, isCapture: m.isCapture,
                                captures: m.captures }));
                            haptic('select');
                            if (!captureInProgress) pushHistory();
                        } else {
                            selectedRow = -1;
                            selectedCol = -1;
                            validMoves = [];
                        }
                    }
                    updateUI();
                    renderBoard();
                    return;
                }

                selectedRow = -1;
                selectedCol = -1;
                validMoves = [];
                updateUI();
                renderBoard();
            }

            // ---- AI logic ----
            function applyMoveSequence(boardState, sequence) {
                const newBoard = boardState.map(r => [...r]);
                for (const step of sequence) {
                    const piece = newBoard[step.fromRow][step.fromCol];
                    newBoard[step.toRow][step.toCol] = piece;
                    newBoard[step.fromRow][step.fromCol] = 0;
                    for (const c of (step.captures || [])) {
                        newBoard[c.row][c.col] = 0;
                    }
                    if (step.capturedRow !== undefined) {
                        newBoard[step.capturedRow][step.capturedCol] = 0;
                    }
                    const player = getPiecePlayerOnBoard(newBoard, step.toRow, step.toCol);
                    if (player === PLAYER_1 && step.toRow === 0 && piece === PLAYER_1) newBoard[step.toRow][step.toCol] = 3;
                    if (player === PLAYER_2 && step.toRow === BOARD_SIZE - 1 && piece === PLAYER_2) newBoard[step.toRow][step
                        .toCol] = 4;
                }
                return newBoard;
            }

            function getAllMoveSequencesForPlayer(boardState, player) {
                const sequences = [];
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (getPiecePlayerOnBoard(boardState, r, c) !== player) continue;
                        const caps = buildCaptureSequences(boardState, r, c, player, [], []);
                        for (const seq of caps) {
                            const fullSeq = seq.map((s, idx) => ({
                                fromRow: idx === 0 ? r : seq[idx - 1].toRow,
                                fromCol: idx === 0 ? c : seq[idx - 1].toCol,
                                toRow: s.toRow,
                                toCol: s.toCol,
                                captures: [{ row: s.capturedRow, col: s.capturedCol }],
                                capturedRow: s.capturedRow,
                                capturedCol: s.capturedCol
                            }));
                            sequences.push({ type: 'capture', sequence: fullSeq, fromRow: r, fromCol: c });
                        }
                        const normals = [];
                        const piece = boardState[r][c];
                        const king = isKing(piece);
                        if (king && gameSettings.flyingKings) {
                            const dirs = [
                                [-1, -1],
                                [-1, 1],
                                [1, -1],
                                [1, 1]
                            ];
                            for (const [dr, dc] of dirs) {
                                for (let step = 1;; step++) {
                                    const nr = r + step * dr,
                                        nc = c + step * dc;
                                    if (!inBounds(nr, nc) || !isDarkSquare(nr, nc)) break;
                                    if (boardState[nr][nc] === 0) {
                                        normals.push({ toRow: nr, toCol: nc, captures: [] });
                                    } else break;
                                }
                            }
                        } else {
                            const rowDirsNormal = king ? [-1, 1] : (player === PLAYER_1 ? [-1] : [1]);
                            for (const dr of rowDirsNormal) {
                                for (const dc of [-1, 1]) {
                                    const nr = r + dr,
                                        nc = c + dc;
                                    if (inBounds(nr, nc) && isDarkSquare(nr, nc) && boardState[nr][nc] === 0) {
                                        normals.push({ toRow: nr, toCol: nc, captures: [] });
                                    }
                                }
                            }
                        }
                        for (const nm of normals) {
                            sequences.push({ type: 'normal', sequence: [{ fromRow: r, fromCol: c, ...nm }] });
                        }
                    }
                }
                const captureSeqs = sequences.filter(s => s.type === 'capture');
                const normalMoves = sequences.filter(s => s.type === 'normal');
                if (captureSeqs.length > 0 && gameSettings.forceCapture) {
                    if (gameSettings.variant === 1) {
                        const maxLen = Math.max(...captureSeqs.map(s => s.sequence.length));
                        return captureSeqs.filter(s => s.sequence.length === maxLen);
                    }
                    return captureSeqs;
                }
                return [...captureSeqs, ...normalMoves];
            }

            function terminalState(boardState, player) {
                return getAllMoveSequencesForPlayer(boardState, player).length === 0;
            }

            function evaluateBoard(boardState, aiPlayer) {
                let score = 0;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        const piece = boardState[r][c];
                        if (piece === 0) continue;
                        const player = getPiecePlayerOnBoard(boardState, r, c);
                        const isKingPiece = isKing(piece);
                        let val = isKingPiece ? 200 : 100;
                        if (player === PLAYER_1) val += (BOARD_SIZE - 1 - r) * 2;
                        else val += r * 2;
                        if (c >= 2 && c <= 5) val += 3;
                        if (player === aiPlayer) score += val;
                        else score -= val;
                    }
                }
                return score;
            }

            function alphaBeta(boardState, depth, alpha, beta, maximizingPlayer, aiPlayer, deadline) {
                if (Date.now() > deadline) return evaluateBoard(boardState, aiPlayer);
                if (depth === 0 || terminalState(boardState, maximizingPlayer ? aiPlayer : (aiPlayer === PLAYER_1 ? PLAYER_2 :
                        PLAYER_1))) {
                    return evaluateBoard(boardState, aiPlayer);
                }
                const current = maximizingPlayer ? aiPlayer : (aiPlayer === PLAYER_1 ? PLAYER_2 : PLAYER_1);
                const moveSequences = getAllMoveSequencesForPlayer(boardState, current);
                if (moveSequences.length === 0) return maximizingPlayer ? -10000 : 10000;
                moveSequences.sort((a, b) => (b.type === 'capture' ? 1 : 0) - (a.type === 'capture' ? 1 : 0));
                if (maximizingPlayer) {
                    let maxEval = -Infinity;
                    for (const move of moveSequences) {
                        if (Date.now() > deadline) break;
                        const newBoard = applyMoveSequence(boardState, move.sequence);
                        const evalScore = alphaBeta(newBoard, depth - 1, alpha, beta, false, aiPlayer, deadline);
                        maxEval = Math.max(maxEval, evalScore);
                        alpha = Math.max(alpha, evalScore);
                        if (beta <= alpha) break;
                    }
                    return maxEval === -Infinity ? evaluateBoard(boardState, aiPlayer) : maxEval;
                } else {
                    let minEval = Infinity;
                    for (const move of moveSequences) {
                        if (Date.now() > deadline) break;
                        const newBoard = applyMoveSequence(boardState, move.sequence);
                        const evalScore = alphaBeta(newBoard, depth - 1, alpha, beta, true, aiPlayer, deadline);
                        minEval = Math.min(minEval, evalScore);
                        beta = Math.min(beta, evalScore);
                        if (beta <= alpha) break;
                    }
                    return minEval === Infinity ? evaluateBoard(boardState, aiPlayer) : minEval;
                }
            }

            function getAIMove() {
                const aiPlayer = PLAYER_2;
                const moveSequences = getAllMoveSequencesForPlayer(board, aiPlayer);
                if (moveSequences.length === 0) return null;
                const difficulty = gameSettings.aiDifficulty;
                if (difficulty === 'easy') {
                    return moveSequences[Math.floor(Math.random() * moveSequences.length)];
                }
                if (difficulty === 'medium') {
                    let bestMoves = [];
                    let bestScore = -Infinity;
                    for (const move of moveSequences) {
                        const newBoard = applyMoveSequence(board, move.sequence);
                        const sc = evaluateBoard(newBoard, aiPlayer);
                        if (sc > bestScore) { bestScore = sc;
                            bestMoves = [move]; } else if (sc === bestScore) bestMoves.push(move);
                    }
                    return bestMoves[Math.floor(Math.random() * bestMoves.length)];
                }
                if (difficulty === 'hard') {
                    const depth = 4;
                    const deadline = Date.now() + 2000;
                    let bestMoves = [];
                    let bestScore = -Infinity;
                    for (const move of moveSequences) {
                        if (Date.now() > deadline) break;
                        const newBoard = applyMoveSequence(board, move.sequence);
                        const evalScore = alphaBeta(newBoard, depth - 1, -Infinity, Infinity, false, aiPlayer, deadline);
                        if (evalScore > bestScore) { bestScore = evalScore;
                            bestMoves = [move]; } else if (evalScore === bestScore) bestMoves.push(move);
                    }
                    if (bestMoves.length === 0) return moveSequences[0];
                    return bestMoves[Math.floor(Math.random() * bestMoves.length)];
                }
                return moveSequences[0];
            }

            function performAIMove() {
                if (gameOver || currentPlayer !== PLAYER_2 || !gameSettings.vsAI) return;
                hideThinkingIndicator();
                pushHistory();
                const move = getAIMove();
                if (!move) return;
                for (const step of move.sequence) {
                    executeMove(step.fromRow, step.fromCol, step.toRow, step.toCol, step.captures);
                }
                if (checkWinCondition()) {
                    updateUI();
                    renderBoard();
                    return;
                }
                switchTurn();
                updateUI();
                renderBoard();
                checkWinCondition();
                updateUI();
                renderBoard();
            }

            function triggerAIMoveIfNeeded() {
                clearAITimeout();
                if (gameOver) return;
                if (gameSettings.vsAI && currentPlayer === PLAYER_2) {
                    showThinkingIndicator();
                    aiTimeout = setTimeout(performAIMove, 350);
                } else {
                    hideThinkingIndicator();
                }
            }

            function clearAITimeout() {
                if (aiTimeout) {
                    clearTimeout(aiTimeout);
                    aiTimeout = null;
                }
                hideThinkingIndicator();
            }

            // ---- Reset game ----
            function resetGame() {
                clearAITimeout();
                hideThinkingIndicator();
                initBoard();
                currentPlayer = PLAYER_1;
                selectedRow = -1;
                selectedCol = -1;
                validMoves = [];
                captureInProgress = false;
                gameOver = false;
                scores = { [PLAYER_1]: 12, [PLAYER_2]: 12 };
                gameStatus.textContent = '';
                moveHistory = [];
                undoBtn.disabled = true;
                recentlyCaptured.clear();
                recentlyCoronated = null;
                recentlyMoved = null;
                clearEffects();
                updateSettingsSummary();
                updateUI();
                renderBoard(true);
                updateFocusToCurrentPlayer();
                updateUITurnText();
                triggerAIMoveIfNeeded();
            }

            function initBoard() {
                board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
                if (gameSettings.startingPosition === 'standard') {
                    for (let row = 0; row < BOARD_SIZE; row++) {
                        for (let col = 0; col < BOARD_SIZE; col++) {
                            if ((row + col) % 2 === 0) continue;
                            if (row < 3) board[row][col] = PLAYER_2;
                            else if (row > 4) board[row][col] = PLAYER_1;
                        }
                    }
                } else if (gameSettings.startingPosition === 'random') {
                    const p2Squares = [];
                    for (let r = 0; r < 3; r++)
                        for (let c = 0; c < BOARD_SIZE; c++)
                            if ((r + c) % 2 === 1) p2Squares.push([r, c]);
                    const p1Squares = [];
                    for (let r = 5; r < 8; r++)
                        for (let c = 0; c < BOARD_SIZE; c++)
                            if ((r + c) % 2 === 1) p1Squares.push([r, c]);
                    const shuffleArr = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math
                                .random() * (i + 1));
                            [arr[i], arr[j]] = [arr[j], arr[i]]; } };
                    shuffleArr(p2Squares);
                    shuffleArr(p1Squares);
                    for (let i = 0; i < 12; i++) {
                        const [r, c] = p2Squares[i];
                        board[r][c] = PLAYER_2;
                        const [r2, c2] = p1Squares[i];
                        board[r2][c2] = PLAYER_1;
                    }
                }
            }

            // ---- UI updates ----
            function updateUI() {
                score1El.textContent = scores[PLAYER_1];
                score2El.textContent = scores[PLAYER_2];
                player1NameDisplay.textContent = gameSettings.player1Name;
                player2NameDisplay.textContent = gameSettings.player2Name;
                if (!gameOver) {
                    updateUITurnText();
                }
                player1Info.classList.toggle('active-player', currentPlayer === PLAYER_1 && !gameOver);
                player2Info.classList.toggle('active-player', currentPlayer === PLAYER_2 && !gameOver);
                undoBtn.disabled = moveHistory.length === 0;
            }

            function updateSettingsSummary() {
                const variantNames = {
                    1: t('GH.damma.internationalShort', 'International'),
                    2: t('GH.damma.americanShort', 'American'),
                    3: t('GH.damma.casualShort', 'Casual')
                };
                const parts = [
                    variantNames[gameSettings.variant],
                    gameSettings.forceCapture ? t('GH.damma.forcedCaptureShort', 'Forced cap') : t('GH.damma.noForceShort', 'No force'),
                    gameSettings.flyingKings ? t('GH.damma.flyingKingShort', 'Flying king') : t('GH.damma.singleKingShort', 'Single king'),
                    gameSettings.backwardCapture ? t('GH.damma.backwardCaptureShort', 'Backward cap') : '',
                    gameSettings.stalemateDraw ? t('GH.damma.stalemateDrawShort', 'Stalemate=draw') : t('GH.damma.stalemateLossShort', 'Stalemate=loss'),
                    gameSettings.vsAI ? t('GH.damma.vsAIWithDifficulty', 'AI ({difficulty})').replace('{difficulty}', t(`GH.damma.${gameSettings.aiDifficulty}`, gameSettings.aiDifficulty)) : t('GH.damma.twoPlayer', '2-player')
                ].filter(Boolean);
                settingsSummary.innerHTML = parts.map(p => `<span>• ${p}</span>`).join('');
            }

            function renderBoard(forceFull = false) {
                if (forceFull || boardSquares.length === 0) {
                    boardEl.innerHTML = '';
                    boardSquares = [];
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        boardSquares[r] = [];
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            const sq = document.createElement('div');
                            sq.className = 'GH-damma-square ' + (isDarkSquare(r, c) ? 'dark' : 'light');
                            sq.dataset.row = r;
                            sq.dataset.col = c;
                            sq.addEventListener('click', () => handleSquareClick(r, c));
                            sq.setAttribute('role', 'gridcell');
                            sq.setAttribute('aria-label', `Row ${r+1}, Column ${c+1}`);
                            boardEl.appendChild(sq);
                            boardSquares[r][c] = sq;
                        }
                    }
                }
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        const sq = boardSquares[r][c];
                        const piece = board[r][c];
                        sq.className = 'GH-damma-square ' + (isDarkSquare(r, c) ? 'dark' : 'light');
                        const isValidMove = validMoves.some(m => m.row === r && m.col === c);
                        const isValidCapture = validMoves.some(m => m.row === r && m.col === c && m.isCapture);
                        if (isValidCapture) sq.classList.add('highlight-capture');
                        else if (isValidMove) sq.classList.add('highlight-valid');
                        if (selectedRow === r && selectedCol === c) sq.classList.add('selected');
                        if (focusRow === r && focusCol === c && !gameOver) sq.classList.add('keyboard-focus');
                        if (recentlyCaptured.has(`${r},${c}`)) sq.classList.add('capture-flash');
                        sq.innerHTML = '';
                        if (piece !== 0) {
                            const pieceEl = document.createElement('div');
                            pieceEl.className = 'GH-damma-piece';
                            pieceEl.classList.add(piece === PLAYER_1 || piece === 3 ? 'player1' : 'player2');
                            if (isKing(piece)) pieceEl.classList.add('king');
                            if (recentlyMoved && recentlyMoved.row === r && recentlyMoved.col === c) {
                                pieceEl.classList.add('move-animate');
                            }
                            if (recentlyCoronated && recentlyCoronated.row === r && recentlyCoronated.col === c) {
                                pieceEl.classList.add('coronation-glow');
                            }
                            sq.appendChild(pieceEl);
                        }
                    }
                }
                setTimeout(() => {
                    recentlyCaptured.clear();
                    recentlyCoronated = null;
                    recentlyMoved = null;
                }, 400);
            }

            // ---- Effects ----
            function clearEffects() { effectsContainer.innerHTML = ''; }

            function createConfetti() {
                const colors = ['#f1c40f', '#e67e22', '#e74c3c', '#9b59b6', '#2ecc71', '#3498db'];
                for (let i = 0; i < 80; i++) {
                    const el = document.createElement('div');
                    el.className = 'GH-damma-confetti-piece';
                    el.style.left = Math.random() * 100 + '%';
                    el.style.top = -(Math.random() * 20 + 10) + 'px';
                    el.style.width = (Math.random() * 10 + 6) + 'px';
                    el.style.height = (Math.random() * 10 + 6) + 'px';
                    el.style.background = colors[Math.floor(Math.random() * colors.length)];
                    el.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    el.style.animationDelay = Math.random() * 0.8 + 's';
                    effectsContainer.appendChild(el);
                }
                setTimeout(clearEffects, 3500);
            }

            function createDrawEffect() {
                const colors = ['#bdc3c7', '#95a5a6', '#7f8c8d'];
                for (let i = 0; i < 40; i++) {
                    const el = document.createElement('div');
                    el.className = 'GH-damma-confetti-piece';
                    el.style.left = Math.random() * 100 + '%';
                    el.style.top = -(Math.random() * 20 + 10) + 'px';
                    el.style.width = (Math.random() * 6 + 4) + 'px';
                    el.style.height = (Math.random() * 6 + 4) + 'px';
                    el.style.background = colors[Math.floor(Math.random() * colors.length)];
                    el.style.animationDuration = (Math.random() * 1.5 + 2) + 's';
                    el.style.animationDelay = Math.random() * 0.5 + 's';
                    effectsContainer.appendChild(el);
                }
                setTimeout(clearEffects, 3000);
            }

            function triggerEndEffect(winningPlayer) {
                clearEffects();
                if (winningPlayer === 0) {
                    playSound('draw');
                    createDrawEffect();
                } else {
                    playSound('win');
                    createConfetti();
                }
            }

            // ---- Keyboard Navigation ----
            boardWrapper.addEventListener('keydown', (e) => {
                if (gameOver) return;
                if (gameSettings.vsAI && currentPlayer === PLAYER_2 && !captureInProgress) return;

                switch (e.key) {
                    case 'ArrowUp':
                        e.preventDefault();
                        moveFocus(-1, 0);
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        moveFocus(1, 0);
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        moveFocus(0, -1);
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        moveFocus(0, 1);
                        break;
                    case 'Enter':
                    case ' ':
                        e.preventDefault();
                        if (focusRow >= 0 && focusCol >= 0) {
                            handleSquareClick(focusRow, focusCol);
                        }
                        break;
                    case 'Escape':
                        e.preventDefault();
                        if (captureInProgress) {
                            undoMove();
                        } else {
                            selectedRow = -1;
                            selectedCol = -1;
                            validMoves = [];
                            updateUI();
                            renderBoard();
                        }
                        break;
                    case 'u':
                    case 'U':
                        if (!e.ctrlKey && !e.metaKey) {
                            e.preventDefault();
                            undoMove();
                        }
                        break;
                    default:
                        break;
                }
            });

            boardWrapper.addEventListener('focus', () => {
                if (focusRow < 0 || focusCol < 0) updateFocusToCurrentPlayer();
                renderBoard();
            });

            // ---- Buttons ----
            newGameBtn.addEventListener('click', () => {
                resetGame();
            });

            document.addEventListener('keydown', (e) => {
                if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey && document.activeElement ===
                    document.body) {
                    resetGame();
                }
            });

            // ---- Initialize ----
            initBoard();
            updateFocusToCurrentPlayer();
            updateSettingsSummary();
            updateUI();
            renderBoard(true);
            openSettingsModal();
        })();
    </script>
